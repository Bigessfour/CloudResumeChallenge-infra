# =============================================================================
# Terraform Plan Workflow
# Runs on every pull request that touches Terraform files.
# Uses OIDC - no AWS secrets required.
# =============================================================================

name: Terraform Plan

on:
  pull_request:
    paths:
      - "bootstrap/**"
      - "environments/**"
      - "lambda/**"
      - ".github/workflows/terraform-*.yml"
      - "versions.tf"
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC
  contents: read    # Required for checkout
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  # Inject deployment-specific Terraform variables from GitHub Actions vars
  # (kept out of source so the repo stays a fork-friendly template).
  TF_VAR_website_bucket_name: ${{ vars.WEBSITE_BUCKET_NAME }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_subject_alternative_names: ${{ vars.SUBJECT_ALTERNATIVE_NAMES }}

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    # Use GitHub Environment for consistency (can add protection rules later)
    environment: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: terraform-plan-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.9.0"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        working-directory: environments/prod
        run: terraform fmt -check -recursive || (echo "❌ Terraform formatting issues found" && exit 1)

      - name: Terraform Init
        working-directory: environments/prod
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: environments/prod
        run: terraform validate

      - name: Terraform Plan
        working-directory: environments/prod
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan.binary
          terraform show -no-color tfplan.binary > tfplan.txt

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/prod/tfplan.txt', 'utf8');
            
            const output = `## 🛠️ Terraform Plan Results
            
            **Commit:** ${context.sha}
            
            \`\`\`terraform
            ${plan.substring(0, 65000)}
            \`\`\`
            
            *Plan generated by GitHub Actions using OIDC*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
